<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IndoorMap — Explorer</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <style>
    :root {
      --bg:#0d1516; --panel:#0e1117; --panel2:#192122;
      --border:rgba(0,229,255,0.12); --cyan:#00e5ff;
      --cyan-dim:rgba(0,229,255,0.1); --text:#dce4e5;
      --muted:#5a6e71; --error:#ef4444;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;}
    #map{position:fixed;inset:0;}
    .maplibregl-ctrl-attrib,.maplibregl-ctrl-logo{display:none!important;}

    .navbar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:20px 32px;}
    .nav-logo{font-size:16px;font-weight:700;color:#f0f4f5;}
    .nav-link{font-size:13px;font-weight:500;color:var(--muted);text-decoration:none;transition:color .2s;}
    .nav-link:hover{color:var(--cyan);}

    .search-wrap{position:fixed;top:40px;left:50%;transform:translateX(-50%);z-index:90;width:min(520px,calc(100vw - 32px));}
    .search-box{display:flex;align-items:center;gap:10px;background:rgba(14,17,23,.85);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:9999px;padding:10px 18px;}
    .search-input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px;font-family:inherit;}
    .search-input::placeholder{color:var(--muted);}
    .search-dropdown{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.5);display:none;z-index:200;}
    .search-dropdown.show{display:block;}
    .search-result{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;transition:background .15s;}
    .search-result:hover{background:var(--panel2);}
    .search-result-name{font-size:13px;font-weight:500;flex:1;}
    .floor-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:9999px;background:var(--cyan-dim);color:var(--cyan);}

    .route-bar{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:90;width:min(520px,calc(100vw - 32px));display:none;}
    .route-bar.show{display:block;}
    .route-bar-inner{display:flex;align-items:center;gap:10px;background:rgba(14,17,23,.9);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:9999px;padding:10px 18px;}
    .route-bar-text{flex:1;font-size:13px;font-weight:500;}
    .route-bar-x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;}

    .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:80;width:310px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;transform:translateX(0);transition:transform .3s cubic-bezier(.4,0,.2,1);}
    .sidebar.collapsed{transform:translateX(-100%);}
    .sidebar-toggle{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:85;width:28px;height:48px;background:var(--panel);border:1px solid var(--border);border-left:none;border-radius:0 10px 10px 0;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--cyan);font-size:14px;transition:left .3s;}
    .sidebar-toggle.shifted{left:310px;}
    .sidebar-header{display:flex;align-items:center;padding:20px 20px 16px;border-bottom:1px solid var(--border);flex-shrink:0;gap:8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);}

    .nav-inputs{padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0;}
    .nav-input-row{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:9px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .2s;}
    .nav-input-row:hover{border-color:rgba(0,229,255,.3);}
    .nav-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
    .nav-dot.start{background:var(--cyan);}
    .nav-dot.end{background:var(--error);}
    .nav-input-text{flex:1;font-size:13px;}
    .nav-input-text.placeholder{color:var(--muted);}
    .nav-input-clear{font-size:16px;color:var(--muted);cursor:pointer;display:none;}
    .nav-input-clear.show{display:block;}
    .route-btn{width:100%;padding:10px;border-radius:10px;background:var(--cyan-dim);border:1px solid rgba(0,229,255,.3);color:var(--cyan);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;cursor:pointer;font-family:inherit;transition:background .2s;}
    .route-btn:hover:not(:disabled){background:rgba(0,229,255,.2);}
    .route-btn:disabled{opacity:.4;cursor:not-allowed;}

    .top-picks{flex:1;overflow:hidden;display:flex;flex-direction:column;padding:16px 20px;}
    .section-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:12px;}
    .filter-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;flex-shrink:0;scrollbar-width:none;}
    .filter-row::-webkit-scrollbar{display:none;}
    .filter-pill{padding:5px 12px;border-radius:9999px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;border:1px solid var(--border);color:var(--muted);background:none;font-family:inherit;transition:all .15s;}
    .filter-pill.active{background:var(--cyan);border-color:var(--cyan);color:#000;}
    .poi-list{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
    .poi-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer;transition:background .15s;margin-bottom:4px;}
    .poi-item:hover{background:var(--panel2);}
    .poi-emoji{width:38px;height:38px;border-radius:10px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
    .poi-info{flex:1;min-width:0;}
    .poi-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .poi-meta{font-size:11px;color:var(--muted);margin-top:2px;}
    .poi-floor-tag{font-size:10px;font-weight:700;color:var(--cyan);}

    .floor-selector{position:fixed;right:16px;top:50%;transform:translateY(-50%);z-index:80;display:flex;flex-direction:column;gap:4px;}
    .floor-btn{width:48px;height:48px;border-radius:12px;background:var(--panel);border:1px solid var(--border);color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;transition:all .2s;}
    .floor-btn.active{background:var(--cyan-dim);border-color:var(--cyan);color:var(--cyan);}

    /* ── POI Marker floating — BARU ── */
    .poi-marker{display:flex;flex-direction:column;align-items:center;cursor:pointer;}
    .poi-marker-bubble{
      background:rgba(14,17,23,.60);backdrop-filter:blur(12px);
      border:1px solid rgba(0,229,255,.2);border-radius:10px;
      padding:2px 7px;display:flex;align-items:center;gap:6px;
      box-shadow:0 4px 16px rgba(0,0,0,.5);white-space:nowrap;
      transition:all .2s;
    }
    .poi-marker-bubble:hover,.poi-marker-bubble.selected{
      border-color:var(--cyan);background:rgba(12, 231, 255, 0.12);
    }
    .poi-marker-icon{font-size:13px;line-height:1;}
    .poi-marker-label{font-size:8px;font-weight:600;color:var(--text);max-width:110px;overflow:hidden;text-overflow:ellipsis;}
    .poi-marker-stem{width:1.5px;height:10px;background:rgba(0,229,255,.3);}
    .poi-marker-dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);border:2px solid rgba(0,229,255,.35);}

    .poi-detail{position:fixed;bottom:-100%;left:50%;transform:translateX(-50%);width:min(600px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--border);border-radius:20px 20px 0 0;z-index:300;transition:bottom .35s cubic-bezier(.4,0,.2,1);padding-bottom:20px;}
    .poi-detail.show{bottom:0;}
    .poi-detail-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 16px;}
    .poi-detail-body{padding:0 20px;}
    .poi-detail-name{font-size:22px;font-weight:800;margin-bottom:8px;}
    .poi-detail-badges{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
    .badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:9999px;background:var(--panel2);color:var(--muted);}
    .badge.cyan{background:var(--cyan-dim);color:var(--cyan);}
    .poi-detail-desc{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:16px;}
    .poi-detail-actions{display:flex;gap:10px;}
    .btn-set-start{flex:1;padding:11px;border-radius:10px;border:1px solid var(--border);background:none;color:var(--text);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;}
    .btn-set-start:hover{border-color:var(--cyan);color:var(--cyan);}
    .btn-set-dest{flex:2;padding:11px;border-radius:10px;border:none;background:var(--cyan);color:#000;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}

    .route-panel{position:fixed;bottom:-100%;left:50%;transform:translateX(-50%);width:min(600px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--border);border-radius:20px 20px 0 0;z-index:200;transition:bottom .4s cubic-bezier(.4,0,.2,1);max-height:60vh;display:flex;flex-direction:column;}
    .route-panel.show{bottom:0;}
    .route-panel-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 0;flex-shrink:0;}
    .route-panel-header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 10px;border-bottom:1px solid var(--border);flex-shrink:0;}
    .route-title{font-size:14px;font-weight:700;}
    .route-meta{font-size:12px;color:var(--muted);}
    .route-close{width:32px;height:32px;border-radius:50%;background:var(--panel2);border:none;cursor:pointer;color:var(--muted);font-size:18px;display:flex;align-items:center;justify-content:center;}
    .route-steps{flex:1;overflow-y:auto;padding:16px 20px;scrollbar-width:thin;}
    .route-step{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04);}
    .route-step:last-child{border-bottom:none;}
    .step-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;background:var(--panel2);}
    .step-text{font-size:13px;line-height:1.5;padding-top:6px;}
    .route-finish-btn{margin:12px 20px 20px;padding:12px;background:var(--cyan-dim);border:1px solid rgba(0,229,255,.3);color:var(--cyan);border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0;}

    .loading-overlay{position:fixed;inset:0;z-index:500;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .6s;}
    .loading-overlay.hidden{opacity:0;pointer-events:none;}
    .loading-name{font-size:22px;font-weight:700;}
    .loading-name span{color:var(--cyan);}
    .loading-bar{width:160px;height:2px;background:var(--panel2);border-radius:1px;overflow:hidden;}
    .loading-fill{height:100%;background:var(--cyan);animation:loadbar 2s ease forwards;}
    @keyframes loadbar{from{width:0}to{width:100%}}
    .loading-sub{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}

    @media(max-width:768px){
      .sidebar{width:100%;}
      .sidebar-toggle.shifted{left:100%;}
      .floor-selector{right:8px;}
    }
  </style>
</head>
<body>

<div class="loading-overlay" id="loading">
  <div class="loading-name">Indoor<span>Map</span></div>
  <div class="loading-bar"><div class="loading-fill"></div></div>
  <div class="loading-sub" id="loading-text">Memuat peta...</div>
</div>

<div id="map"></div>

<nav class="navbar">
  <div class="nav-logo">IndoorMap</div>
</nav>

<div class="search-wrap" id="search-wrap">
  <div class="search-box">
    <span style="color:var(--cyan)">🔍</span>
    <input class="search-input" id="search-input" placeholder="Cari tempat di sini..." autocomplete="off">
  </div>
  <div class="search-dropdown" id="search-dropdown"></div>
</div>

<div class="route-bar" id="route-bar">
  <div class="route-bar-inner">
    <span>📍</span>
    <span class="route-bar-text" id="route-bar-text">—</span>
    <button class="route-bar-x" onclick="resetRoute()">✕</button>
  </div>
</div>

<div class="sidebar" id="sidebar">
  <div class="sidebar-header">&nbsp;</div>
  <div class="nav-inputs">
    <div class="nav-input-row" onclick="focusInput('start')">
      <div class="nav-dot start"></div>
      <div class="nav-input-text placeholder" id="start-text">Pilih titik awal...</div>
      <span class="nav-input-clear" id="start-clear" onclick="clearInput('start',event)">✕</span>
    </div>
    <div class="nav-input-row" onclick="focusInput('end')">
      <div class="nav-dot end"></div>
      <div class="nav-input-text placeholder" id="end-text">Pilih tujuan...</div>
      <span class="nav-input-clear" id="end-clear" onclick="clearInput('end',event)">✕</span>
    </div>
    <button class="route-btn" id="route-btn" onclick="startRoute()" disabled>Start Routing</button>
  </div>
  <div class="top-picks">
    <div class="section-label">Top Picks</div>
    <div class="filter-row" id="filter-row">
      <button class="filter-pill active" onclick="filterPOI('semua',this)">Semua</button>
    </div>
    <div class="poi-list" id="poi-list">
      <div style="color:var(--muted);font-size:13px;text-align:center;padding:20px">Memuat...</div>
    </div>
  </div>
</div>

<button class="sidebar-toggle shifted" id="sidebar-toggle" onclick="toggleSidebar()">◀</button>

<div class="floor-selector">
  <button class="floor-btn active" id="floor-gf" onclick="setFloor('111')">GF</button>
  <button class="floor-btn" id="floor-b1" onclick="setFloor('112')">B1</button>
</div>

<div class="poi-detail" id="poi-detail">
  <div class="poi-detail-handle"></div>
  <div class="poi-detail-body">
    <div class="poi-detail-name" id="detail-name">—</div>
    <div class="poi-detail-badges" id="detail-badges"></div>
    <div class="poi-detail-desc" id="detail-desc">—</div>
    <div class="poi-detail-actions">
      <button class="btn-set-start" onclick="setAsStart()">Set as Start</button>
      <button class="btn-set-dest" onclick="setAsDestination()">Set as Destination →</button>
    </div>
  </div>
</div>

<div class="route-panel" id="route-panel">
  <div class="route-panel-handle"></div>
  <div class="route-panel-header">
    <div>
      <div class="route-title" id="route-title">—</div>
      <div class="route-meta" id="route-meta">—</div>
    </div>
    <button class="route-close" onclick="resetRoute()">✕</button>
  </div>
  <div class="route-steps" id="route-steps"></div>
  <button class="route-finish-btn" onclick="resetRoute()">✓ Selesaikan Rute</button>
</div>

<script>
const API         = 'https://indoor-wayfinding.onrender.com';
const TABLES_GF   = ['level_111','unit_111','fixture_111'];
const TABLES_B1   = ['level_112','unit_112','fixture_112'];
const LAYER_COLORS = {
  level_111:'#94a3b8', unit_111:'#60a5fa', fixture_111:'#f59e0b',
  level_112:'#64748b', unit_112:'#a78bfa', fixture_112:'#fb923c',
};

// ── Emoji per jenis/nama ──────────────────────────────────
function getEmoji(jenis, nama) {
  const n = (nama||'').toLowerCase();
  if (n.includes('toilet')||n.includes('wc'))     return '🚻';
  if (n.includes('lift')||n.includes('elevator'))  return '🛗';
  if (n.includes('stairs')||n.includes('tangga'))  return '🪜';
  if (n.includes('parking')||n.includes('park'))   return '🅿';
  if (n.includes('cafe')||n.includes('coffee'))    return '☕';
  if (n.includes('food')||n.includes('resto'))     return '🍽';
  if (n.includes('entrance')||n.includes('exit'))  return '🚪';
  if (n.includes('generator')||n.includes('room')) return '⚡';
  const map = { Tenan:'🏪', Facility:'🏛', Office:'🏢', Food:'🍽', Fashion:'👗', Service:'🔧' };
  return map[jenis] || '📍';
}

// ── State ──────────────────────────────────────────────────
let allPOIs      = { '111': [], '112': [] };
let currentFloor = '111';
let selectedPOI  = null;
let startPOI     = null;
let endPOI       = null;
let sidebarOpen  = true;
let inputFocus   = null;
const markerStore = { '111': {}, '112': {} }; // floor → {id: marker}

// ── Map init ───────────────────────────────────────────────
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.stadiamaps.com/styles/alidade_smooth_dark.json',
  center: [144.96948, -37.81286],
  zoom: 19, pitch: 60, bearing: -20, antialias: true
});

map.on('load', async () => {
  await loadIndoorLayers();
  await Promise.all([loadPOIs('111'), loadPOIs('112')]);
  setFloor('111');
  document.getElementById('loading').classList.add('hidden');
});

// ── Indoor layers ──────────────────────────────────────────
async function loadIndoorLayers() {
  for (const t of [...TABLES_GF, ...TABLES_B1]) {
    try {
      document.getElementById('loading-text').textContent = `Memuat ${t}...`;
      const data = await fetch(`${API}/api/indoor/${t}`).then(r=>r.json());
      map.addSource(t, {type:'geojson', data});
      map.addLayer({id:`${t}-fill`, type:'fill-extrusion', source:t, paint:{
        'fill-extrusion-color': LAYER_COLORS[t],
        'fill-extrusion-height': ['get','height'],
        'fill-extrusion-base':   ['get','base'],
        'fill-extrusion-opacity': 0.8
      }});
    } catch(e) { console.error(t, e); }
  }
}

// ── Load POI per lantai — PERUBAHAN: endpoint /api/poi/:floor ──
async function loadPOIs(floor) {
  try {
    document.getElementById('loading-text').textContent = `Memuat POI lantai ${floor}...`;
    const pois = await fetch(`${API}/api/poi/${floor}`).then(r=>r.json());
    allPOIs[floor] = pois.map(p => ({...p, floor}));
    createMarkers(allPOIs[floor], floor);
  } catch(e) { console.error('Load POI gagal', floor, e); }
}

// ── Buat marker floating per lantai — PERUBAHAN: bubble dengan emoji+label ──
function createMarkers(pois, floor) {
  // Hapus marker lama
  Object.values(markerStore[floor]).forEach(m => m.remove());
  markerStore[floor] = {};

  pois.forEach(poi => {
    const emoji = getEmoji(poi.jenis, poi.nama);
    const el = document.createElement('div');
    el.className = 'poi-marker';
    el.innerHTML = `
      <div class="poi-marker-bubble" id="mkr-${floor}-${poi.id}">
        <span class="poi-marker-icon">${emoji}</span>
        <span class="poi-marker-label">${poi.nama}</span>
      </div>
      <div class="poi-marker-stem"></div>
      <div class="poi-marker-dot"></div>
    `;
    el.addEventListener('click', (e) => { e.stopPropagation(); showPOIDetail(poi.id, floor); });

    const marker = new maplibregl.Marker({element: el, anchor: 'bottom'})
      .setLngLat([poi.lng, poi.lat])
      .addTo(map);

    markerStore[floor][poi.id] = marker;
  });
}

// ── Update visibility marker sesuai floor aktif ────────────
function updateMarkerVisibility(floor) {
  ['111','112'].forEach(f => {
    Object.values(markerStore[f]).forEach(m => {
      m.getElement().style.display = f === floor ? 'flex' : 'none';
    });
  });
}

// ── Filter pills & POI list ────────────────────────────────
function buildFilterPills() {
  const pois  = allPOIs[currentFloor];
  const jenis = [...new Set(pois.map(p=>p.jenis).filter(Boolean))];
  const row   = document.getElementById('filter-row');
  row.innerHTML = '<button class="filter-pill active" onclick="filterPOI(\'semua\',this)">Semua</button>';
  jenis.forEach(j => {
    const btn = document.createElement('button');
    btn.className  = 'filter-pill';
    btn.textContent = j;
    btn.onclick    = () => filterPOI(j, btn);
    row.appendChild(btn);
  });
}

function filterPOI(jenis, btn) {
  document.querySelectorAll('.filter-pill').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const pois = allPOIs[currentFloor];
  renderPOIList(jenis==='semua' ? pois : pois.filter(p=>p.jenis===jenis));
}

function renderPOIList(pois) {
  const list = document.getElementById('poi-list');
  if (!pois.length) {
    list.innerHTML = '<div style="color:var(--muted);font-size:13px;text-align:center;padding:20px">Tidak ada hasil</div>';
    return;
  }
  list.innerHTML = pois.map(p=>`
    <div class="poi-item" onclick="showPOIDetail(${p.id},'${p.floor}')">
      <div class="poi-emoji">${getEmoji(p.jenis,p.nama)}</div>
      <div class="poi-info">
        <div class="poi-name">${p.nama}</div>
        <div class="poi-meta">${p.jenis||''}</div>
      </div>
      <span class="poi-floor-tag">${p.floor==='111'?'GF':'B1'}</span>
    </div>
  `).join('');
}

// ── POI Detail ─────────────────────────────────────────────
function showPOIDetail(id, floor) {
  const f   = floor || currentFloor;
  const poi = allPOIs[f]?.find(p=>p.id==id) || allPOIs['111'].find(p=>p.id==id);
  if (!poi) return;
  selectedPOI = poi;

  document.getElementById('detail-name').textContent = poi.nama;
  document.getElementById('detail-badges').innerHTML = `
    <span class="badge cyan">${poi.floor==='111'?'Ground Floor':'Basement'}</span>
    <span class="badge">${poi.jenis||'—'}</span>
  `;
  document.getElementById('detail-desc').textContent =
    `${getEmoji(poi.jenis,poi.nama)} ${poi.nama} — ${poi.jenis||'Tenant'} di lantai ${poi.floor==='111'?'Ground':'Basement'}.`;

  // Highlight marker
  document.querySelectorAll('.poi-marker-bubble').forEach(b=>b.classList.remove('selected'));
  const bubble = document.getElementById(`mkr-${poi.floor}-${poi.id}`);
  if (bubble) bubble.classList.add('selected');

  document.getElementById('poi-detail').classList.add('show');
  map.flyTo({center:[poi.lng,poi.lat], zoom:19.5, duration:800});
}

function closePOIDetail() {
  document.getElementById('poi-detail').classList.remove('show');
  document.querySelectorAll('.poi-marker-bubble').forEach(b=>b.classList.remove('selected'));
  selectedPOI = null;
}

map.on('click', (e) => {
  if (!e.originalEvent.target.closest('.poi-marker')) closePOIDetail();
});

// ── Set start / destination ────────────────────────────────
function setAsStart() {
  if (!selectedPOI) return;
  startPOI = selectedPOI;
  document.getElementById('start-text').textContent = selectedPOI.nama;
  document.getElementById('start-text').classList.remove('placeholder');
  document.getElementById('start-clear').classList.add('show');
  checkRouteReady(); closePOIDetail();
}

function setAsDestination() {
  if (!selectedPOI) return;
  endPOI = selectedPOI;
  document.getElementById('end-text').textContent = selectedPOI.nama;
  document.getElementById('end-text').classList.remove('placeholder');
  document.getElementById('end-clear').classList.add('show');
  checkRouteReady(); closePOIDetail();
}

function checkRouteReady() {
  document.getElementById('route-btn').disabled = !(startPOI && endPOI);
}

function focusInput(type) {
  inputFocus = type;
  document.getElementById('search-input').focus();
}

function clearInput(type, e) {
  e.stopPropagation();
  if (type === 'start') {
    startPOI = null;
    document.getElementById('start-text').textContent = 'Pilih titik awal...';
    document.getElementById('start-text').classList.add('placeholder');
    document.getElementById('start-clear').classList.remove('show');
  } else {
    endPOI = null;
    document.getElementById('end-text').textContent = 'Pilih tujuan...';
    document.getElementById('end-text').classList.add('placeholder');
    document.getElementById('end-clear').classList.remove('show');
  }
  checkRouteReady();
}

// ── Search ──────────────────────────────────────────────────
const searchInput    = document.getElementById('search-input');
const searchDropdown = document.getElementById('search-dropdown');

searchInput.addEventListener('input', () => {
  const q = searchInput.value.toLowerCase().trim();
  if (!q) { searchDropdown.classList.remove('show'); return; }
  const all     = [...allPOIs['111'], ...allPOIs['112']];
  const results = all.filter(p=>p.nama.toLowerCase().includes(q));
  if (!results.length) { searchDropdown.classList.remove('show'); return; }
  searchDropdown.innerHTML = results.slice(0,6).map(p=>`
    <div class="search-result" onclick="selectSearchResult(${p.id},'${p.floor}')">
      <span>${getEmoji(p.jenis,p.nama)}</span>
      <span class="search-result-name">${p.nama}</span>
      <span class="floor-badge">${p.floor==='111'?'GF':'B1'}</span>
    </div>
  `).join('');
  searchDropdown.classList.add('show');
});

function selectSearchResult(id, floor) {
  searchDropdown.classList.remove('show');
  searchInput.value = '';
  const poi = allPOIs[floor]?.find(p=>p.id==id);
  if (!poi) return;
  selectedPOI = poi;
  if (inputFocus === 'start')     setAsStart();
  else if (inputFocus === 'end')  setAsDestination();
  else                            showPOIDetail(id, floor);
  inputFocus = null;
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-wrap')) {
    searchDropdown.classList.remove('show');
    inputFocus = null;
  }
});

// ── Routing — PERUBAHAN: kirim floor ke API ─────────────────
async function startRoute() {
  if (!startPOI || !endPOI) return;

  if (startPOI.floor !== endPOI.floor) {
    alert('Start dan destination harus di lantai yang sama.');
    return;
  }

  const btn = document.getElementById('route-btn');
  btn.textContent = 'Menghitung...';
  btn.disabled = true;

  try {
    const floor = startPOI.floor;

    const response = await fetch(
      `${API}/api/route?from=${startPOI.id}&to=${endPOI.id}&floor=${floor}`
    );

    const text = await response.text();

    console.log(text);

    let result;

    try {
      result = JSON.parse(text);
    } catch {
      throw new Error('Response bukan JSON: ' + text.slice(0,200));
    }

    if (result.error) {
      throw new Error(result.error);
    }

    renderRoute(result);

  } catch(e) {
    console.error(e);
    alert('Routing gagal: ' + e.message);
  } finally {
    btn.textContent = 'Start Routing';
    btn.disabled = false;
  }
}

function renderRoute(result) {
  if (map.getLayer('route-line')) map.removeLayer('route-line');
  if (map.getSource('route'))     map.removeSource('route');

  map.addSource('route', {type:'geojson', data:{type:'Feature', geometry:{type:'LineString', coordinates:result.path_coords}}});
  map.addLayer({id:'route-line', type:'line', source:'route', paint:{'line-color':'#00e5ff','line-width':4,'line-opacity':0.9,'line-dasharray':[2,1]}});

  document.getElementById('search-wrap').style.display = 'none';
  document.getElementById('route-bar').classList.add('show');
  document.getElementById('route-bar-text').textContent = `${result.start_nama} → ${result.end_nama}`;

  const icons = {start:'📍',belok_kanan:'↪️',belok_kiri:'↩️',lurus:'⬆️',balik_arah:'🔄',arrive:'🏁'};
  document.getElementById('route-title').textContent = `${result.start_nama} → ${result.end_nama}`;
  document.getElementById('route-meta').textContent  = `±${result.total_distance}m · ~${Math.ceil(result.total_distance/70)} menit`;
  document.getElementById('route-steps').innerHTML   = result.instructions.map(ins=>`
    <div class="route-step">
      <div class="step-icon">${icons[ins.type]||'•'}</div>
      <div class="step-text">${ins.text}</div>
    </div>
  `).join('');
  document.getElementById('route-panel').classList.add('show');

  if (result.path_coords.length > 1) {
    const lngs = result.path_coords.map(c=>c[0]);
    const lats = result.path_coords.map(c=>c[1]);
    map.fitBounds([[Math.min(...lngs),Math.min(...lats)],[Math.max(...lngs),Math.max(...lats)]],
      {padding:{top:80,bottom:300,left:340,right:80},duration:1000});
  }
}

function resetRoute() {
  if (map.getLayer('route-line')) map.removeLayer('route-line');
  if (map.getSource('route'))     map.removeSource('route');
  document.getElementById('route-panel').classList.remove('show');
  document.getElementById('route-bar').classList.remove('show');
  document.getElementById('search-wrap').style.display = 'block';
  startPOI = null; endPOI = null;
  document.getElementById('start-text').textContent = 'Pilih titik awal...';
  document.getElementById('start-text').classList.add('placeholder');
  document.getElementById('end-text').textContent = 'Pilih tujuan...';
  document.getElementById('end-text').classList.add('placeholder');
  document.getElementById('start-clear').classList.remove('show');
  document.getElementById('end-clear').classList.remove('show');
  document.getElementById('route-btn').disabled = true;
}

// ── Floor switcher — PERUBAHAN: update marker + POI list ───
function setFloor(floor) {
  currentFloor = floor;
  document.getElementById('floor-gf').classList.toggle('active', floor==='111');
  document.getElementById('floor-b1').classList.toggle('active', floor==='112');

  // Show/hide indoor layers
  TABLES_GF.forEach(t => { if(map.getLayer(`${t}-fill`)) map.setLayoutProperty(`${t}-fill`,'visibility',floor==='111'?'visible':'none'); });
  TABLES_B1.forEach(t => { if(map.getLayer(`${t}-fill`)) map.setLayoutProperty(`${t}-fill`,'visibility',floor==='112'?'visible':'none'); });

  // Update marker visibility
  updateMarkerVisibility(floor);

  // Update sidebar: filter pills + poi list
  buildFilterPills();
  renderPOIList(allPOIs[floor]);
}

// ── Sidebar toggle ──────────────────────────────────────────
function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  document.getElementById('sidebar').classList.toggle('collapsed', !sidebarOpen);
  const btn = document.getElementById('sidebar-toggle');
  btn.classList.toggle('shifted', sidebarOpen);
  btn.textContent = sidebarOpen ? '◀' : '▶';
}
</script>
</body>
